<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abbott Cyber GRC Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/core.css"/>
<link rel="stylesheet" href="css/modules.css"/>
</head>
<body>

<!-- NOTE FOR COWORK:
  This is the Abbott Cyber GRC Platform — a SaaS product for cybersecurity consulting.
  The full architecture, design decisions, and build context are in HANDOVER_NOTES.md.
  The backlog with all features (done and pending) is in backlog.json.
  The Supabase database is already set up — connection details are in HANDOVER_NOTES.md.

  FIRST TASK: Get the Supabase connection working.
  The fetch calls below use the correct URL and anon key.
  Test that orgs load on startup. If they do, the rest follows.

  SECOND TASK: Wire the tabletop module to Supabase (session state, session codes).
  THIRD TASK: Build the Jackbox-style multiplayer join flow.

  See backlog.json for full feature list in priority order.
-->

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-label">Abbott Cyber</div>
      <div class="brand-name">GRC Platform</div>
      <div class="brand-tag">Prioritized risk approach</div>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-footer">
      <div class="tier-label-small">Active organisation</div>
      <div class="org-selector">
        <button class="org-btn" id="orgBtn" onclick="toggleOrgDD()">
          <div class="org-avatar av-platform" id="orgAv">AC</div>
          <div class="org-info">
            <div class="org-name-text" id="orgNameEl">Connecting…</div>
            <div class="org-tier-text" id="orgTierEl">Loading database</div>
          </div>
          <span id="orgChev" style="font-size:10px;color:rgba(255,255,255,0.4)">▾</span>
        </button>
        <div class="org-dropdown" id="orgDD" style="display:none" onclick="event.stopPropagation()"></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb" id="breadcrumb">
        <span style="color:var(--text);font-weight:700">Dashboard</span>
      </div>
      <div class="topbar-right">
        <span class="db-status db-loading" id="dbStatus">
          <span class="spinner"></span>Connecting
        </span>
        <div class="topbar-org-pill">
          <div class="org-avatar av-platform" id="topAv" style="width:18px;height:18px;font-size:8px">AC</div>
          <span style="font-size:11px;font-weight:700;color:var(--text)" id="topOrgName">Loading…</span>
        </div>
      </div>
    </div>
    <div class="content" id="mainContent">
      <div style="text-align:center;padding:3rem;color:var(--muted)">
        <div class="spinner" style="border-color:rgba(21,33,104,0.2);border-top-color:var(--navy);width:24px;height:24px;margin:0 auto 1rem"></div>
        <div style="font-size:13px;font-weight:700;color:var(--text)">Connecting to Supabase…</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ORG MANAGER MODAL -->
<div class="modal-backdrop" id="orgModal" style="display:none" onclick="if(event.target===this)closeOrgModal()">
  <div class="modal-box" id="orgModalBox"></div>
</div>

<!-- CIS IMPORT MODAL -->
<div class="modal-backdrop" id="cisImportModal" style="display:none" onclick="if(event.target===this)closeCisModal()">
  <div class="modal-box" style="max-width:640px;width:92%" id="cisImportModalBox"></div>
</div>

<script src="js/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/home.js"></script>
<script src="js/orgs.js"></script>
<script src="js/insurance.js"></script>
<script src="js/cis.js"></script>
<script src="js/techstack.js"></script>
<script src="js/tpra.js"></script>
<script src="js/tabletop.js"></script>
<script src="js/multiplayer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
