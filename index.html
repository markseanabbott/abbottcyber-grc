<div class="layout" id="appShell">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="Transparent Logo.png" alt="Abbott Cyber">
    </div>
    <div class="sidebar-brand">
      <div class="brand-name">GRC Platform</div>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-version" id="sidebarVersion"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb" id="breadcrumb">
        <span style="color:var(--text);font-weight:700">Dashboard</span>
      </div>
      <div class="topbar-right">
        <span class="db-status db-loading" id="dbStatus">
          <span class="spinner"></span>Connecting
        </span>
        <div class="org-selector topbar-org-selector">
          <button class="org-btn topbar-org-btn" id="orgBtn" onclick="toggleOrgDD()">
            <div class="org-avatar av-platform" id="topAv" style="width:22px;height:22px;font-size:9px;flex-shrink:0">AC</div>
            <span style="font-size:11px;font-weight:700;color:var(--text);white-space:nowrap" id="topOrgName">Loadingâ€¦</span>
            <span id="orgChev" style="font-size:10px;color:var(--muted)">â–¾</span>
          </button>
          <div class="org-dropdown topbar-org-dropdown" id="orgDD" style="display:none" onclick="event.stopPropagation()"></div>
        </div>
        <div id="userChipContainer" style="display:contents"></div>
      </div>
    </div>
    <div id="viewAsBanner" style="display:none"></div>
    <div class="content" id="mainContent">
      <div style="text-align:center;padding:3rem;color:var(--muted)">
        <div class="spinner" style="border-color:rgba(21,33,104,0.2);border-top-color:var(--navy);width:24px;height:24px;margin:0 auto 1rem"></div>
        <div style="font-size:13px;font-weight:700;color:var(--text)">Connecting to Supabaseâ€¦</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- IDLE TIMEOUT WARNING MODAL -->
<div id="idleWarningModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:2rem 2rem 1.75rem;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25)">
    <div style="font-size:2.25rem;margin-bottom:0.5rem">â±ï¸</div>
    <div style="font-size:16px;font-weight:700;color:#1a2340;margin-bottom:0.5rem">Session expiring</div>
    <div style="font-size:13px;color:#5a6a8a;line-height:1.6;margin-bottom:1.5rem">You'll be signed out in <strong id="idleCountdown" style="color:#1a2340">120</strong> seconds due to inactivity.</div>
    <button onclick="idleExtend()" style="width:100%;padding:11px;background:linear-gradient(135deg,#152168,#1a2a7a);color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.02em">Stay signed in</button>
  </div>
</div>

<!-- ORG MANAGER MODAL -->

<!-- CHANGE PASSWORD MODAL -->
<div class="modal-backdrop" id="changePwdModal" style="display:none" onclick="if(event.target===this)closeChangePasswordModal()">
  <div class="modal-box" style="max-width:400px;width:95%;padding:2rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h3 style="margin:0;font-size:16px;color:var(--navy)">Change Password</h3>
      <button onclick="closeChangePasswordModal()" style="background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em">New Password</label>
      <input id="changePwdNew" type="password" placeholder="Minimum 8 characters"
        style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);box-sizing:border-box;outline:none"
        onfocus="this.style.borderColor='var(--cyan)'" onblur="this.style.borderColor='var(--border)'"
        onkeydown="if(event.key==='Enter')document.getElementById('changePwdConfirm').focus()">
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em">Confirm Password</label>
      <input id="changePwdConfirm" type="password" placeholder="Repeat new password"
        style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);box-sizing:border-box;outline:none"
        onfocus="this.style.borderColor='var(--cyan)'" onblur="this.style.borderColor='var(--border)'"
        onkeydown="if(event.key==='Enter')submitChangePassword()">
    </div>
    <div id="changePwdError" style="color:#b91c1c;font-size:12px;min-height:16px;margin-bottom:1rem"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline btn-sm" onclick="closeChangePasswordModal()">Cancel</button>
      <button id="changePwdBtn" class="btn btn-primary btn-sm" onclick="submitChangePassword()">Update Password</button>
    </div>
  </div>
</div>

<!-- MODULE MANAGEMENT MODAL -->
<div class="modal-backdrop" id="modModal" style="display:none" onclick="if(event.target===this)modCloseModal()">
  <div class="modal-box" style="max-width:620px;width:95%" id="modModalBox"></div>
</div>

<!-- AI TOOL CATALOG ADMIN MODAL -->

</div>
