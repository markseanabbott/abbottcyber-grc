<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abbott Cyber GRC Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#152168;--navy2:#1a2a7a;--cyan:#07B4D9;--cyan2:#07D1F2;
  --bg:#f0f4fa;--card:#fff;--border:#dde3ef;--text:#1a2340;--muted:#5a6a8a;
  --green:#15803d;--amber:#b45309;--red:#b91c1c;
  --red-bg:#fee2e2;--amber-bg:#fef3c7;--green-bg:#dcfce7;
  --sidebar-w:220px;
}
body{font-family:'Kanit',sans-serif;font-weight:400;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--navy);flex-shrink:0;display:flex;flex-direction:column}
.sidebar-brand{padding:1.1rem 1rem 0.75rem;border-bottom:1px solid rgba(255,255,255,0.08)}
.brand-label{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--cyan2);margin-bottom:2px}
.brand-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.brand-tag{font-size:10px;color:rgba(255,255,255,0.4);font-style:italic}
.sidebar-nav{flex:1;overflow-y:auto;padding:0.5rem 0}
.nav-group-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:0.6rem 1rem 0.3rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 1rem;cursor:pointer;transition:all 0.15s;font-size:12px;color:rgba(255,255,255,0.6);border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.9)}
.nav-item.active{background:rgba(7,180,217,0.15);color:#fff;border-left-color:var(--cyan)}
.nav-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.nav-score-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-green{background:#4ade80}.dot-amber{background:#fbbf24}.dot-red{background:#f87171}.dot-none{background:rgba(255,255,255,0.15)}
.nav-section-hdr{display:flex;align-items:center;gap:8px;padding:8px 1rem;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.4);transition:all 0.15s;user-select:none;border-left:2px solid transparent}
.nav-section-hdr:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)}
.nav-section-hdr.open{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.05)}
.nav-section-chevron{margin-left:auto;font-size:9px;transition:transform 0.2s;display:inline-block}
.nav-section-hdr.open .nav-section-chevron{transform:rotate(90deg)}
.nav-section-children{overflow:hidden;max-height:0;transition:max-height 0.25s ease-out}
.nav-section-children.open{max-height:500px}
.sidebar-footer{padding:0.75rem 1rem;border-top:1px solid rgba(255,255,255,0.08)}
.tier-label-small{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:5px}

/* ORG SWITCHER */
.org-selector{position:relative}
.org-btn{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:7px;padding:6px 8px;color:#fff;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s}
.org-btn:hover{background:rgba(255,255,255,0.13)}
.org-avatar{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.av-platform{background:linear-gradient(135deg,#152168,#07B4D9);color:#fff}
.av-gf{background:#07B4D9;color:#fff}
.av-f{background:#4f46e5;color:#fff}
.av-c{background:#16a34a;color:#fff}
.org-info{flex:1;text-align:left;overflow:hidden}
.org-name-text{font-size:11px;font-weight:700;color:#fff;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-tier-text{font-size:9px;color:rgba(255,255,255,0.45);font-weight:400}
.org-dropdown{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--navy2);border:1px solid rgba(255,255,255,0.15);border-radius:9px;overflow:hidden;z-index:100;box-shadow:0 -8px 24px rgba(0,0,0,0.3);max-height:340px;overflow-y:auto}
.org-section-lbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:7px 10px 3px;background:var(--navy2)}
.org-option{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;transition:background 0.12s}
.org-option:hover{background:rgba(255,255,255,0.08)}
.org-option.selected{background:rgba(7,180,217,0.15)}
.org-opt-name{font-size:11px;font-weight:700;color:#fff}
.org-opt-sub{font-size:9px;color:rgba(255,255,255,0.4)}
.org-divider{height:1px;background:rgba(255,255,255,0.07);margin:3px 0}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0.75rem 1.25rem;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-breadcrumb{font-size:11px;color:var(--muted);flex:1;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-org-pill{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px 10px 3px 5px}
.db-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.db-live{background:#dcfce7;color:#15803d}
.db-loading{background:#fef3c7;color:#92400e}
.db-error{background:#fee2e2;color:#b91c1c}
.content{flex:1;overflow-y:auto;padding:1.25rem}

/* SHARED COMPONENTS */
.btn{font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;padding:7px 16px;border-radius:7px;border:none;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#1e2f8a}
.btn-cyan{background:var(--cyan);color:#fff}.btn-cyan:hover{background:#059ab8}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.btn-outline:hover{background:#eef1ff}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-amber{background:#d97706;color:#fff}.btn-amber:hover{background:#b45309}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-sm{padding:5px 11px;font-size:11px}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:1.1rem 1.25rem;margin-bottom:0.85rem}
.card-title{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--cyan);margin-bottom:0.75rem}
.badge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.b-navy{background:#eef1ff;color:#152168}.b-cyan{background:#e0f7fc;color:#0369a1}
.b-green{background:#dcfce7;color:#15803d}.b-amber{background:#fef3c7;color:#92400e}
.b-red{background:#fee2e2;color:#b91c1c}.b-purple{background:#f3e8ff;color:#7c3aed}
.b-gray{background:#f1f5f9;color:#475569}.b-platform{background:linear-gradient(135deg,#152168,#07B4D9);color:#fff}
select,input[type=text]{font-family:'Kanit',sans-serif;font-size:12px;width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);outline:none}
textarea{font-family:'Kanit',sans-serif;font-size:12px;width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);resize:vertical;min-height:60px;outline:none;line-height:1.4}
.view-tabs{display:flex;gap:4px;margin-bottom:0.85rem;border-bottom:2px solid var(--border);flex-wrap:wrap}
.view-tab{font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;padding:7px 14px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.view-tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.1rem}
.wcard{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:0.9rem 1rem}
.wcard-icon{font-size:18px;margin-bottom:5px}
.wcard-label{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.wcard-val{font-size:22px;font-weight:700;color:var(--text)}
.wcard-sub{font-size:11px;color:var(--muted);margin-top:1px}
.tier-banner{border-radius:10px;padding:0.75rem 1rem;margin-bottom:0.85rem;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.tier-banner-platform{background:linear-gradient(135deg,#0d1b4e,#152168);border:1px solid rgba(7,180,217,0.3);color:var(--cyan2)}
.tier-banner-gf{background:#e0f7fc;border:1px solid #7dd3fc;color:#0369a1}
.tier-banner-father{background:#ede9fe;border:1px solid #c4b5fd;color:#6d28d9}
.tier-banner-child{background:#dcfce7;border:1px solid #86efac;color:#15803d}
.score-hero-ins{background:var(--navy);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}
.score-big{font-size:56px;font-weight:700;line-height:1;display:flex;align-items:baseline;gap:4px}
.score-big span{font-size:18px;color:rgba(255,255,255,0.4);font-weight:400}
.score-band{font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px;display:inline-block;margin-top:8px}
.band-high{background:#dcfce7;color:#14532d}.band-mid{background:#fef9c3;color:#92400e}.band-low{background:#fee2e2;color:#b91c1c}
.survey-panel{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:0.75rem}
.sph{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1.1rem;cursor:pointer;transition:background 0.15s}
.sph:hover{background:var(--bg)}
.spb{display:none;padding:0.9rem 1.1rem;border-top:1px solid var(--border)}
.spb.open{display:block}
.mini-opt{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;border:1.5px solid var(--border);cursor:pointer;font-size:12px;transition:all 0.13s;margin-bottom:4px}
.mini-opt:hover{border-color:var(--cyan);background:#f0fbfe}
.mini-opt.sel{border-color:var(--navy);background:#eef1ff;font-weight:700}
.mini-opt input{accent-color:var(--navy);width:13px;height:13px;flex-shrink:0}
.savings-box{background:#0a2540;border-radius:10px;padding:1rem 1.25rem;margin-bottom:0.85rem}
.savings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:0.6rem}
.sav-card{background:rgba(255,255,255,0.07);border-radius:7px;padding:0.65rem 0.8rem;border:1px solid rgba(255,255,255,0.1)}
.coming-soon{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:2rem;text-align:center}
.cs-phase{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px;background:#eef1ff;color:#152168}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;padding:10px 16px;border-radius:8px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.add-org-form{background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:0.85rem 1rem;margin-top:0.75rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.org-tree-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.org-tree-item:last-child{border-bottom:none}

/* ORG MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(21,33,104,0.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border-radius:14px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem 0.75rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1;border-radius:14px 14px 0 0}
.modal-title{font-size:14px;font-weight:700;color:var(--text)}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px;line-height:1;font-family:'Kanit',sans-serif}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:1.1rem 1.25rem}
.modal-footer{padding:0.75rem 1.25rem 1.1rem;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.profile-section{margin-bottom:1.1rem}
.profile-section-title{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--cyan);margin-bottom:0.65rem;padding-bottom:4px;border-bottom:1px solid var(--border)}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cb-item{display:flex;align-items:center;gap:5px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:700;transition:all 0.13s;user-select:none}
.cb-item:hover{border-color:var(--cyan)}
.cb-item.checked{border-color:var(--navy);background:#eef1ff;color:var(--navy)}
.cb-item input{accent-color:var(--navy);width:11px;height:11px;flex-shrink:0}
.delete-confirm-box{background:#fff5f5;border:2px solid #fca5a5;border-radius:10px;padding:1rem 1.25rem;margin-bottom:0.85rem}
.risk-profile-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.rpb-low{background:#dcfce7;color:#15803d}.rpb-medium{background:#fef9c3;color:#92400e}
.rpb-high{background:#fed7aa;color:#c2410c}.rpb-critical{background:#fee2e2;color:#b91c1c}

/* TABLETOP */
.commentary-card{background:linear-gradient(135deg,#0d1b4e,#152168);border-radius:10px;border:1px solid rgba(7,180,217,0.3);padding:1.25rem;margin-bottom:0.85rem}
.declaration-step{background:var(--card);border-radius:10px;border:2px solid var(--cyan);padding:1.1rem 1.25rem;margin-bottom:0.85rem}
.signal-box{background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:0.8rem 1rem;margin-bottom:0.75rem}
.nist-track{display:flex;gap:4px;margin-bottom:0.85rem;flex-wrap:wrap}
.nist-step{flex:1;min-width:60px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 6px;text-align:center;font-size:9px;font-weight:700;color:var(--muted);transition:all 0.2s}
.nist-step.active{background:var(--navy);border-color:var(--navy);color:#fff}
.nist-step.complete{background:var(--green-bg);border-color:#86efac;color:var(--green)}
.nist-step.decl-step{background:rgba(7,180,217,0.1);border-color:var(--cyan);color:var(--cyan)}
.inject-card{background:var(--card);border-radius:10px;border:2px solid var(--cyan);padding:1.1rem 1.25rem;margin-bottom:0.85rem}
.inject-body-box{font-size:13px;color:var(--text);line-height:1.6;background:var(--bg);border-radius:7px;padding:0.75rem 0.9rem;margin-bottom:0.75rem;border-left:3px solid var(--cyan)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0.75rem}
.role-resp{background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:0.7rem 0.85rem}
.crit-btn{font-family:'Kanit',sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all 0.13s}
.crit-btn.sel-Critical{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.crit-btn.sel-High{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.crit-btn.sel-Medium{background:#e0f7fc;border-color:#7dd3fc;color:#0369a1}
.crit-btn.sel-Low{background:#f0fdf4;border-color:#86efac;color:#15803d}
.sev-btn{font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all 0.13s;margin-right:5px;margin-bottom:5px}
.sev-btn.sel-P1{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.sev-btn.sel-P2{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.sev-btn.sel-P3{background:#e0f7fc;border-color:#7dd3fc;color:#0369a1}
.sev-btn.sel-P4{background:#f0fdf4;border-color:#86efac;color:#15803d}
.fn-box{background:#fffbeb;border-radius:7px;padding:0.65rem 0.85rem;margin-bottom:0.75rem;border-left:3px solid #fbbf24}
.breach-gate{background:#1a0a0a;border-radius:10px;border:2px solid #dc2626;padding:1.1rem 1.25rem;margin-bottom:0.85rem}
.co-sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0.75rem}
.co-sign-card{background:rgba(255,255,255,0.05);border-radius:8px;border:1px solid rgba(255,255,255,0.1);padding:0.75rem}
.erc-box{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:0.85rem;margin-bottom:0.75rem}
.notif-card{background:var(--card);border-radius:10px;border:2px solid var(--amber);padding:1.1rem 1.25rem;margin-bottom:0.85rem}
.notif-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;transition:all 0.13s}
.notif-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.summary-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.sm-card{background:var(--bg);border-radius:8px;padding:0.7rem 0.85rem;text-align:center}
.sm-val{font-size:20px;font-weight:700;color:var(--navy)}
.sm-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}
.aar-log-item{display:grid;grid-template-columns:60px 80px 1fr;gap:8px;align-items:start;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.aar-log-item:last-child{border-bottom:none}

/* TECH STACK SURVEY */
.ts-question{padding:0.85rem 0;border-bottom:1px solid var(--border)}
.ts-question:last-child{border-bottom:none}
.ts-q-text{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:6px}
.ts-q-suggestion{font-size:11px;color:var(--muted);margin-bottom:8px;font-style:italic;line-height:1.4}
.ts-q-suggestion::before{content:"💡 ";font-style:normal}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 9px 0}
.chip{font-family:'Kanit',sans-serif;font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;border:1px solid;cursor:pointer;transition:all 0.13s;white-space:nowrap;line-height:1.3;display:inline-flex;align-items:center;gap:4px}
.chip-fw{font-weight:700;opacity:0.7;font-size:9px;letter-spacing:0.04em}
.chip-cis{background:#e0f7fc;border-color:#7dd3fc;color:#0369a1}
.chip-cis:hover{background:#bae6fd;border-color:#0284c7}

<script>

const SB_URL = 'https://sssyimtkvmtgjpusedvq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzc3lpbXRrdm10Z2pwdXNlZHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzA1NTMsImV4cCI6MjA5NDU0NjU1M30.FxQaJn97YewSQi6s45nw1LgMRfBj8xhswLM47_Q2zXI';

async function sbFetch(path, method = 'GET', body = null, extraHeaders = {}) {
  const headers = {
    'apikey': SB_KEY,
    'Authorization': `Bearer ${SB_KEY}`,
    'Content-Type': 'application/json',
    'Accept': 'application/json',
  };
  if (method === 'POST' && !extraHeaders.Prefer) headers.Prefer = 'return=representation';
  Object.assign(headers, extraHeaders);
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  if (res.status === 204) return null;
  return res.json();
}

const sb = {
  orgs: () => sbFetch('organisations?select=*&order=tier.asc,name.asc'),
  assessments: (orgId) => sbFetch(`assessments?org_id=eq.${orgId}&order=assessed_at.asc`),
  saveAssessment: (d) => sbFetch('assessments', 'POST', d),
  createOrg: (d) => sbFetch('organisations', 'POST', d),
  updateOrg: (id, patch) => sbFetch(`organisations?id=eq.${id}`, 'PATCH', patch, { Prefer: 'return=representation' }),
  deleteOrg: (id) => sbFetch(`organisations?id=eq.${id}`, 'DELETE', null, { Prefer: 'return=representation' }),
};

// Organisation Profiles persistence layer
sb.profiles = {
  getAll: () => sbFetch('organisation_profiles?select=*'),
  get: (orgId) => sbFetch(`organisation_profiles?org_id=eq.${orgId}&select=*`),
  upsert: (row) => sbFetch('organisation_profiles', 'POST', row, { Prefer: 'resolution=merge-duplicates,return=representation' }),
};

// Technology Stack Survey persistence layer
sb.techstack = {
  getResponses: (orgId) => sbFetch(`techstack_responses?org_id=eq.${orgId}&select=*`),
  upsertResponse: (row) => sbFetch('techstack_responses', 'POST', row, { Prefer: 'resolution=merge-duplicates,return=representation' }),
  // Snapshot to assessments table for trend tracking (same pattern as insurance module)
  saveSnapshot: (d) => sbFetch('assessments', 'POST', d),
};

// Third-Party Risk Assessment persistence layer
sb.tpra = {
  getAll: (orgId) => sbFetch(`vendor_assessments?org_id=eq.${orgId}&order=created_at.desc`),
  upsert: (row) => sbFetch('vendor_assessments', 'POST', row, { Prefer: 'resolution=merge-duplicates,return=representation' }),
  update: (id, patch) => sbFetch(`vendor_assessments?id=eq.${id}`, 'PATCH', patch, { Prefer: 'return=representation' }),
  delete: (id) => sbFetch(`vendor_assessments?id=eq.${id}`, 'DELETE'),
};

// Tabletop persistence layer — wraps Supabase calls for the operational tabletop module.
sb.tt = {
  // RPC: ask the DB for a fresh 6-char session code (alphabet defined in SUPABASE_SCHEMA.sql)
  newCode: async () => {
    const r = await sbFetch('rpc/generate_session_code', 'POST', {});
    return typeof r === 'string' ? r : (r && r[0]) || '';
  },
  createSession: async (row) => {
    const r = await sbFetch('tabletop_sessions', 'POST', row);
    return Array.isArray(r) ? r[0] : r;
  },
  updateSession: (id, patch) => sbFetch(`tabletop_sessions?id=eq.${id}`, 'PATCH', patch, { Prefer: 'return=representation' }),
  getSession: async (id) => {
    const r = await sbFetch(`tabletop_sessions?id=eq.${id}&select=*`);
    return r && r[0];
  },
  upsertResponse: (row) => sbFetch('tabletop_responses', 'POST', row, { Prefer: 'resolution=merge-duplicates,return=representation' }),
  upsertNotif: (row) => sbFetch('tabletop_notif_checks', 'POST', row, { Prefer: 'resolution=merge-duplicates,return=representation' }),
  appendLog: (sessionId, exerciseLog) => sbFetch(`tabletop_sessions?id=eq.${sessionId}`, 'PATCH', { exercise_log: exerciseLog, updated_at: new Date().toISOString() }, { Prefer: 'return=representation' }),
  // Multiplayer methods
  getSessionByCode: async (code) => {
    const r = await sbFetch(`tabletop_sessions?session_code=eq.${encodeURIComponent(code)}&select=*`);
    return r && r[0] ? r[0] : null;
  },
  getParticipants: async (sessionId) => {
    const r = await sbFetch(`tabletop_participants?session_id=eq.${sessionId}&select=*&order=joined_at.asc`);
    return r || [];
  },
  claimRole: async (row) => {
    const r = await sbFetch('tabletop_participants', 'POST', row, { Prefer: 'return=representation' });
    return Array.isArray(r) ? r[0] : r;
  },
  getResponses: async (sessionId, injectIdx) => {
    const r = await sbFetch(`tabletop_responses?session_id=eq.${sessionId}&inject_index=eq.${injectIdx}&select=*`);
    return r || [];
  },
};

// ============================================================
function visibleOrgs() {
  if (!currentOrg) return [];
  if (currentOrg.tier === 'platform') return allOrgs;
  if (currentOrg.tier === 'grandfather') {
    const fathers = allOrgs.filter(o => o.parent_id === currentOrg.id);
    const fatherIds = fathers.map(f => f.id);
    const children = allOrgs.filter(o => fatherIds.includes(o.parent_id));
    return [currentOrg, ...fathers, ...children];
  }
  if (currentOrg.tier === 'father') {
    return [currentOrg, ...allOrgs.filter(o => o.parent_id === currentOrg.id)];
  }
  return [currentOrg];
}

async function loadOrgProfiles() {
  try {
    const rows = await sb.profiles.getAll();
    orgProfiles = {};
    (rows || []).forEach(p => { orgProfiles[p.org_id] = p; });
  } catch (e) { console.warn('Profile load failed', e); }
}

async function init() {
  // Multiplayer URL routing — intercept before normal app boot
  if (_MP_JOIN) { mpBoot(_MP_JOIN); return; }
  if (_MP_DISP) { dispBoot(_MP_DISP); return; }
  try {
    allOrgs = await sb.orgs();
    const platform = allOrgs.find(o => o.tier === 'platform') || allOrgs[0];
    currentOrg = platform;
    await Promise.all([loadAssessments(platform.id), loadOrgProfiles()]);
    document.getElementById('dbStatus').className = 'db-status db-live';
    document.getElementById('dbStatus').textContent = '● Live';
    updateOrgUI(); buildNav(); renderMain();
  } catch (e) {
    document.getElementById('dbStatus').className = 'db-status db-error';
    document.getElementById('dbStatus').textContent = 'DB Error';
    document.getElementById('mainContent').innerHTML = `
      <div style="text-align:center;padding:2rem">
        <div style="font-size:28px;margin-bottom:0.75rem">⚠️</div>
        <div style="font-size:14px;font-weight:700;color:var(--red);margin-bottom:6px">Database connection failed</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:1rem;max-width:420px;margin-left:auto;margin-right:auto">${e.message}</div>
        <button class="btn btn-primary btn-sm" onclick="init()">Retry</button>
      </div>`;
  }
}

function toast(msg, col = '#152168') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = col;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

async function loadAssessments(orgId) {
  if (orgAssessments[orgId]) return;
  try {
    const rows = await sb.assessments(orgId);
    orgAssessments[orgId] = {};
    (rows || []).forEach(r => {
      if (!orgAssessments[orgId][r.module]) orgAssessments[orgId][r.module] = [];
      orgAssessments[orgId][r.module].push({ date: r.assessed_at, score: r.score, secPct: r.sec_pct, insPct: r.ins_pct, answers: r.answers || {} });
    });
  } catch (e) { orgAssessments[orgId] = {}; }
}

function updateOrgUI() {
  if (!currentOrg) return;
  const av = tierAvClass(currentOrg.tier);
  const ini = tierInitials(currentOrg.name);
  const lbl = TIER_LABELS[currentOrg.tier] || currentOrg.tier;
  ['orgAv', 'topAv'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'org-avatar ' + av;
    el.textContent = ini;
    if (id === 'topAv') el.style.cssText = 'width:18px;height:18px;font-size:8px';
  });
  document.getElementById('orgNameEl').textContent = currentOrg.name;
  document.getElementById('orgTierEl').textContent = lbl;
  document.getElementById('topOrgName').textContent = currentOrg.name;
}

function toggleOrgDD() {
  const dd = document.getElementById('orgDD');
  const open = dd.style.display === 'block';
  if (!open) buildOrgDropdown();
  dd.style.display = open ? 'none' : 'block';
  document.getElementById('orgChev').textContent = open ? '▾' : '▴';
}

function buildOrgDropdown() {
  const dd = document.getElementById('orgDD');
  const switchable = currentOrg.tier === 'platform' ? allOrgs : visibleOrgs();
  const sectionLabels = { platform: 'Platform Owner', grandfather: 'Grandfather', father: 'Father — Groups', child: 'Child — Clients' };
  let h = '';
  TIER_ORDER.forEach(tier => {
    const orgs = switchable.filter(o => o.tier === tier);
    if (!orgs.length) return;
    h += `<div class="org-divider"></div><div class="org-section-lbl">${sectionLabels[tier]}</div>`;
    orgs.forEach(o => {
      const parent = allOrgs.find(p => p.id === o.parent_id);
      const sub = parent ? parent.name : tier === 'platform' ? 'Full platform visibility' : '';
      h += `<div class="org-option${currentOrg?.id === o.id ? ' selected' : ''}" onclick="selectOrg('${o.id}')">
        <div class="org-avatar ${tierAvClass(tier)}">${tierInitials(o.name)}</div>
        <div><div class="org-opt-name">${o.name}</div><div class="org-opt-sub">${sub}</div></div>
      </div>`;
    });
  });
  dd.innerHTML = h || '<div style="padding:10px;font-size:11px;color:rgba(255,255,255,0.4)">No organisations</div>';
}

async function selectOrg(id) {
  currentOrg = allOrgs.find(o => o.id === id);
  document.getElementById('orgDD').style.display = 'none';
  document.getElementById('orgChev').textContent = '▾';
  insState = { answers: {}, openPanels: {} };
  tsState = null;  // tech stack state is per-org — force reload on next view
  tpraState = null;  // TPRA state is per-org — force reload on next view
  await loadAssessments(id);
  updateOrgUI(); buildNav(); renderMain();
}

document.addEventListener('click', e => {

    document.getElementById('orgDD').style.display = 'none';
    document.getElementById('orgChev').textContent = '▾';

});

function getModuleDot(id) {
  if (!currentOrg || ['home', 'tabletop', 'orgs', 'assessments'].includes(id)) return 'dot-none';
  const h = (orgAssessments[currentOrg.id] || {})[id];
  if (!h || !h.length) return 'dot-none';
  const s = h[h.length - 1].score;
  return s >= 75 ? 'dot-green' : s >= 50 ? 'dot-amber' : 'dot-red';
}

function buildNav() {
  document.getElementById('sidebarNav').innerHTML = NAV.map(g => {
    const isOpen = g.id === activeNavSection;
    return `
    <div class="nav-section">
      <div class="nav-section-hdr${isOpen ? ' open' : ''}" onclick="toggleNavSection('${g.id}')">
        <span class="nav-icon">${g.icon}</span>
        <span>${g.group}</span>
        <span class="nav-section-chevron">▶</span>
      </div>
      <div class="nav-section-children${isOpen ? ' open' : ''}">
        ${g.items.map(item => `
        <div class="nav-item${item.id === activeNav ? ' active' : ''}" onclick="setNav('${item.id}')">
          <span class="nav-icon">${item.icon}</span>
          <span>${item.label}</span>
          ${item.live ? `<span class="nav-score-dot ${getModuleDot(item.id)}"></span>` : `<span style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.2);margin-left:auto">P${item.phase}</span>`}
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleNavSection(id) {
  activeNavSection = activeNavSection === id ? null : id;
  buildNav();
}

function setNav(id) {
  activeNav = id;
  const item = NAV.flatMap(g => g.items).find(i => i.id === id);
  const group = NAV.find(g => g.items.some(i => i.id === id));
  if (group) activeNavSection = group.id;
  document.getElementById('breadcrumb').innerHTML =
    `${group ? `<span style="color:var(--muted)">${group.group}</span> <span style="color:var(--muted)">›</span> ` : ''}<span style="color:var(--text);font-weight:700">${item ? item.label : id}</span>`;
  buildNav(); renderMain();
}

// ============================================================
function renderMain() {
  const el = document.getElementById('mainContent');
  if (activeNav === 'home') { el.innerHTML = renderHome(); drawTrend(); return; }
  if (activeNav === 'assessments') { el.innerHTML = renderAssessmentsHub(); setTimeout(drawAllHubTrends, 80); return; }
  if (activeNav === 'insurance') { el.innerHTML = renderInsurance(); drawTrend(); return; }
  if (activeNav === 'cis_ig1') { el.innerHTML = renderCIS('ig1'); return; }
  if (activeNav === 'cis_ig2') { el.innerHTML = renderCIS('ig2'); return; }
  if (activeNav === 'cis_ig3') { el.innerHTML = renderCIS('ig3'); return; }
  if (activeNav === 'orgs') { el.innerHTML = renderOrgManager(); setTimeout(updateParentOptions, 100); return; }
  if (activeNav === 'tabletop') { el.innerHTML = renderTabletop(); return; }
  if (activeNav === 'techstack') {
    if (!tsState || tsState.orgId !== currentOrg.id) {
      tsInit();
      tsState.orgId = currentOrg.id;
      el.innerHTML = renderTechStack();   // render loading state immediately
      tsLoadResponses().then(() => tsRender());
    } else {
      el.innerHTML = renderTechStack();
    }
    return;
  }
  if (activeNav === 'tpra') {
    if (!tpraState || tpraState.orgId !== currentOrg.id) {
      tpraInit();
      el.innerHTML = renderTierBanner() + `<div style="text-align:center;padding:2rem;color:var(--muted)">
        <div class="spinner" style="border-color:rgba(21,33,104,0.2);border-top-color:var(--navy);width:20px;height:20px;margin:0 auto 0.75rem"></div>
        <div style="font-size:12px">Loading vendor assessments…</div>
      </div>`;
      tpraLoadAssessments().then(() => {
        if (activeNav === 'tpra') el.innerHTML = renderTierBanner() + renderTPRAList();
      });
    } else {
      el.innerHTML = renderTPRAInner();
    }
    return;
  }
  const item = NAV.flatMap(g => g.items).find(i => i.id === activeNav);
  el.innerHTML = `<div class="coming-soon">
    <div style="font-size:32px;margin-bottom:0.5rem">${item ? item.icon : '🔧'}</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:4px">${item ? item.label : activeNav}</div>
    <div style="font-size:12px;color:var(--muted)">This module is on the roadmap.</div>
    <div class="cs-phase">Phase ${item ? item.phase : '?'}</div>
  </div>`;
}

      const runs = (h[item.id] || []);

function updateParentOptions() {
  const tier = document.getElementById('newOrgTier')?.value;
  const sel = document.getElementById('newOrgParent');
  if (!sel) return;
  const parentTier = tier === 'child' ? 'father' : tier === 'father' ? 'grandfather' : tier === 'grandfather' ? 'platform' : null;
  if (!parentTier) { sel.innerHTML = '<option value="">No parent</option>'; return; }
  sel.innerHTML = allOrgs.filter(o => o.tier === parentTier).map(o => `<option value="${o.id}">${o.name}</option>`).join('');
}

async function addOrg() {
  const name = document.getElementById('newOrgName')?.value?.trim();
  const tier = document.getElementById('newOrgTier')?.value;
  const parent = document.getElementById('newOrgParent')?.value || null;
  const industry = document.getElementById('newOrgIndustry')?.value?.trim() || null;
  if (!name) { toast('Please enter a name.', '#dc2626'); return; }
  const btn = event.target; btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const result = await sb.createOrg({ name, tier, parent_id: parent || null, industry });
    allOrgs.push(result[0]);
    toast(`✓ ${name} added`, '#15803d');
    buildNav(); renderMain();
  } catch (e) {
    toast('Error: ' + e.message, '#dc2626');
    btn.disabled = false; btn.textContent = 'Add Organisation';
  }
}

function toggleCb(label, inputId) {
  const cb = document.getElementById(inputId);
  if (!cb) return;
  cb.checked = !cb.checked;
  label.classList.toggle('checked', cb.checked);
}

function updateEditSubIndustry() {
  const industry = document.getElementById('editOrgIndustry')?.value;
  const subs = ORG_SUB_INDUSTRIES[industry] || [];
  const sel = document.getElementById('editOrgSubIndustry');
  if (!sel) return;
  sel.innerHTML = `<option value="">— Select —</option>` + subs.map(s => `<option value="${s}">${s}</option>`).join('');
}

function updateEditParentOptions() {
  // Refresh parent dropdown when tier changes in edit modal
  const tier = document.getElementById('editOrgTier')?.value;
  const orgId = document.getElementById('orgEditId')?.value;
  const sel = document.getElementById('editOrgParent');
  if (!sel || !tier) return;
  const parentTierMap = { child: 'father', father: 'grandfather', grandfather: 'platform', platform: null };
  const allowedParentTier = parentTierMap[tier];
  sel.innerHTML = `<option value="">— None —</option>` +
    allOrgs
      .filter(o => o.id !== orgId && (!allowedParentTier || o.tier === allowedParentTier))
      .map(o => `<option value="${o.id}">${o.name} (${o.tier})</option>`)
      .join('');
}

async function saveOrgEdit(orgId) {
  const btn = event.target; btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const org = allOrgs.find(o => o.id === orgId);
    const isDetails = orgModalTab === 'details';

    if (isDetails) {
      // Save org table fields
      const patch = {
        name: document.getElementById('editOrgName')?.value?.trim() || org.name,
        industry: document.getElementById('editOrgIndustry')?.value || null,
        tier: document.getElementById('editOrgTier')?.value || org.tier,
        parent_id: document.getElementById('editOrgParent')?.value || null,
        logo_url: document.getElementById('editOrgLogo')?.value?.trim() || null,
        updated_at: new Date().toISOString(),
      };
      await sb.updateOrg(orgId, patch);
      // Merge into allOrgs cache
      const idx = allOrgs.findIndex(o => o.id === orgId);
      if (idx !== -1) allOrgs[idx] = { ...allOrgs[idx], ...patch };

      // Save managed_by to profile (create profile record if not exists)
      const managedBy = document.getElementById('editOrgManagedBy')?.value || null;
      await sb.profiles.upsert({ org_id: orgId, managed_by_org_id: managedBy || null });
      await loadOrgProfiles();

      toast(`✓ ${patch.name} updated`, '#15803d');
    } else {
      // Save profile fields
      const regChecked = ORG_REGULATORY
        .filter(r => document.getElementById('reg_' + r.replace(/[^a-z0-9]/gi,'_'))?.checked)
        .join(',');

      const profileRow = {
        org_id: orgId,
        employee_count_band: document.getElementById('pEditEmployees')?.value || null,
        annual_revenue_band: document.getElementById('pEditRevenue')?.value || null,
        org_structure: document.getElementById('pEditStructure')?.value || null,
        sub_industry: document.getElementById('editOrgSubIndustry')?.value || null,
        geographic_presence: document.getElementById('pEditGeo')?.value || null,
        remote_workforce_pct: document.getElementById('pEditRemote')?.value || null,
        data_sensitivity: document.getElementById('pEditDataSensitivity')?.value || null,
        handles_pii: document.getElementById('pEditPii')?.checked || false,
        handles_payment_data: document.getElementById('pEditPayment')?.checked || false,
        handles_health_data: document.getElementById('pEditHealth')?.checked || false,
        regulatory_scope: regChecked || null,
        it_maturity: document.getElementById('pEditMaturity')?.value || null,
        cloud_adoption: document.getElementById('pEditCloud')?.value || null,
        vendor_count_band: document.getElementById('pEditVendors')?.value || null,
        critical_vendor_dependency: document.getElementById('pEditCritVendor')?.checked || false,

function confirmDeleteOrg(orgId) {
  const org = allOrgs.find(o => o.id === orgId);
  if (!org) return;
  const children = allOrgs.filter(o => o.parent_id === orgId);
  const grandchildren = children.flatMap(c => allOrgs.filter(o => o.parent_id === c.id));
  const totalCascade = children.length + grandchildren.length;

  const modal = document.getElementById('orgModal');
  const box = document.getElementById('orgModalBox');
  box.innerHTML = `
    <div class="modal-header">
      <div class="modal-title" style="color:#b91c1c">⚠️ Delete Organisation</div>

          <strong>${totalCascade} child organisation${totalCascade !== 1 ? 's' : ''}</strong>
          (${children.length} direct${grandchildren.length > 0 ? ` + ${grandchildren.length} nested` : ''}),
          plus all their assessments, tabletop sessions, and risk profiles.` : ''}

async function deleteOrgConfirmed(orgId) {
  const btn = event.target; btn.disabled = true; btn.textContent = 'Deleting…';
  const org = allOrgs.find(o => o.id === orgId);
  try {
    await sb.deleteOrg(orgId);
    // Remove org and all descendants from local cache
    const idsToRemove = new Set();
    const collectIds = (id) => {
      idsToRemove.add(id);
      allOrgs.filter(o => o.parent_id === id).forEach(c => collectIds(c.id));
    };
    collectIds(orgId);
    allOrgs = allOrgs.filter(o => !idsToRemove.has(o.id));
    if (currentOrg && idsToRemove.has(currentOrg.id)) {
      currentOrg = allOrgs.find(o => o.tier === 'platform') || allOrgs[0];
    }
    toast(`✓ ${org?.name || 'Organisation'} deleted`, '#15803d');
    closeOrgModal();
    updateOrgUI(); buildNav(); renderMain();
  } catch (e) {
    toast('Delete failed: ' + e.message, '#dc2626');
    btn.disabled = false; btn.textContent = 'Delete permanently';
  }
}

function insSecScore(s) { return s.questions.reduce((a, q) => { const r = insState.answers[q.id]; return a + (r !== undefined ? r * q.secW : 0); }, 0); }
function insInsScore(s) { return s.questions.reduce((a, q) => { const r = insState.answers[q.id]; return a + (r !== undefined ? r * q.insW : 0); }, 0); }
function insSecMax(s) { return s.questions.reduce((a, q) => a + q.secW, 0); }
function insInsMax(s) { return s.questions.reduce((a, q) => a + q.insW, 0); }
function insAnswered(s) { return s.questions.filter(q => insState.answers[q.id] !== undefined).length; }
function insAllDone() { return INS_SECTIONS.every(s => insAnswered(s) === s.questions.length); }
function insCalc() {
  const sm = INS_SECTIONS.reduce((a, s) => a + insSecMax(s), 0);
  const im = INS_SECTIONS.reduce((a, s) => a + insInsMax(s), 0);
  const ss = Math.round(INS_SECTIONS.reduce((a, s) => a + insSecScore(s), 0) / sm * 100);
  const is = Math.round(INS_SECTIONS.reduce((a, s) => a + insInsScore(s), 0) / im * 100);
  return { score: Math.round(ss * 0.4 + is * 0.6), secPct: ss, insPct: is };
}

function drawTrend() {
  const runs = (orgAssessments[currentOrg?.id] || {}).insurance || [];
  if (runs.length < 2) return;
  setTimeout(() => {
    const canvas = document.getElementById('trendChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.offsetWidth || 200; canvas.width = W; const H = 70;
    ctx.clearRect(0, 0, W, H);
    const scores = runs.map(r => r.score);
    const mn = Math.min(...scores) - 10, mx = Math.max(...scores) + 10;
    const px = i => Math.round(i * (W - 20) / (runs.length - 1) + 10);
    const py = v => Math.round(H - 6 - (v - mn) / (mx - mn) * (H - 16));
    ctx.beginPath(); ctx.strokeStyle = '#07B4D9'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    scores.forEach((s, i) => { i === 0 ? ctx.moveTo(px(i), py(s)) : ctx.lineTo(px(i), py(s)); }); ctx.stroke();
    scores.forEach((s, i) => {
      ctx.beginPath(); ctx.arc(px(i), py(s), 4, 0, Math.PI * 2);
      ctx.fillStyle = s >= 75 ? '#15803d' : s >= 50 ? '#b45309' : '#b91c1c'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Kanit,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(s, px(i), py(s) - 7);
    });
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '9px Kanit,sans-serif';
    runs.forEach((r, i) => { ctx.textAlign = 'center'; ctx.fillText(r.date.slice(5), px(i), H); });
  }, 80);
}

            <td>
              ${runs.length >= 2
                ? `<canvas id="hub-trend-${a.id}" class="trend-canvas" width="110" height="36"></canvas>`
                : `<span style="font-size:10px;color:var(--muted)">${runs.length === 1 ? '1 run — need 2+' : '—'}</span>`}
            </td>
            <td>
              <div style="display:flex;gap:5px;flex-wrap:wrap">
                ${a.comingSoon
                  ? `<span style="font-size:10px;font-weight:700;color:var(--muted);padding:4px 8px;border-radius:6px;background:var(--bg)">Coming soon</span>`
                  : `<button class="btn btn-cyan btn-sm" onclick="setNav('${a.nav}')">${last ? 'View / Run' : 'Start'}</button>`}
                ${canDuplicate ? `<button class="btn btn-outline btn-sm" title="Duplicate for re-up assessment" onclick="duplicateAssessment('${a.id}')">⧉ Re-up</button>` : ''}
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px">
    💡 <strong>Re-up</strong> duplicates the last assessment's answers (clearing evidence notes) so you can quickly run a follow-up without starting from scratch.
  </div>`;
}

function drawAllHubTrends() {
  const h = orgAssessments[currentOrg?.id] || {};
  ASSESSMENT_CATALOG.forEach(a => {
    const runs = h[a.id] || [];
    if (runs.length < 2) return;
    const canvas = document.getElementById(`hub-trend-${a.id}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 110, H = 36;
    canvas.width = W; canvas.height = H;
    ctx.clearRect(0, 0, W, H);
    const scores = runs.map(r => r.score);
    const mn = Math.max(0, Math.min(...scores) - 10);
    const mx = Math.min(100, Math.max(...scores) + 10);
    const px = i => Math.round(8 + i * (W - 16) / (scores.length - 1));
    const py = v => Math.round(H - 6 - (v - mn) / (mx - mn) * (H - 14));
    // Fill area under line
    ctx.beginPath();
    scores.forEach((s, i) => { i === 0 ? ctx.moveTo(px(i), py(s)) : ctx.lineTo(px(i), py(s)); });
    ctx.lineTo(px(scores.length - 1), H); ctx.lineTo(px(0), H); ctx.closePath();
    ctx.fillStyle = 'rgba(7,180,217,0.08)'; ctx.fill();
    // Line
    ctx.beginPath(); ctx.strokeStyle = '#07B4D9'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
    scores.forEach((s, i) => { i === 0 ? ctx.moveTo(px(i), py(s)) : ctx.lineTo(px(i), py(s)); });
    ctx.stroke();
    // Dots
    scores.forEach((s, i) => {
      ctx.beginPath(); ctx.arc(px(i), py(s), 3, 0, Math.PI * 2);
      ctx.fillStyle = s >= 75 ? '#15803d' : s >= 50 ? '#b45309' : '#b91c1c'; ctx.fill();
    });
    // Last score label
    const last = scores[scores.length - 1];
    ctx.fillStyle = last >= 75 ? '#15803d' : last >= 50 ? '#b45309' : '#b91c1c';
    ctx.font = 'bold 8px Kanit,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(last, W - 2, 9);
  });
}

// Duplicate an assessment: copy latest answers, clear evidence/notes, go to survey
function duplicateAssessment(moduleId) {
  const h = orgAssessments[currentOrg?.id] || {};
  const runs = h[moduleId] || [];
  if (!runs.length) return;
  const last = runs[runs.length - 1];
  if (moduleId === 'insurance') {
    insState = { answers: Object.assign({}, last.answers || {}), openPanels: { [INS_SECTIONS[0].id]: true } };
    toast('✓ Copied last answers — update and re-save when ready', '#152168');
    setNav('insurance');
  } else if (moduleId.startsWith('cis_')) {
    const ig = moduleId.replace('cis_', '');
    cisState = { ig, answers: Object.assign({}, last.answers || {}), openPanels: {} };
    toast('✓ Copied last answers — update and re-save when ready', '#152168');
    setNav(moduleId);
  } else if (moduleId === 'techstack') {
    toast('✓ Navigate to Technology Stack to review and re-run', '#152168');
    setNav('techstack');
  }
}

// Returns safeguards for a given IG level (ig1 = IG1 only; ig2 = IG1+IG2; ig3 = all)
function cisGetSafeguards(ig) {
  const maxIg = ig === 'ig1' ? 1 : ig === 'ig2' ? 2 : 3;
  return CIS_SAFEGUARDS.filter(s => s.ig <= maxIg);
}

function cisCalcScore(ig) {
  const sfs = cisGetSafeguards(ig);
  if (!sfs.length) return { score: 0, answered: 0, total: sfs.length };
  const answered = sfs.filter(s => cisState.answers[s.sf] !== undefined);
  const yes = sfs.filter(s => cisState.answers[s.sf] === 'yes').length;
  const partial = sfs.filter(s => cisState.answers[s.sf] === 'partial').length;
  const total = sfs.length;
  const raw = (yes + partial * 0.5) / total;
  return { score: Math.round(raw * 100), answered: answered.length, total };
}

function renderCIS(ig) {
  if (!currentOrg) return '';
  if (cisState.ig !== ig) {
    // Load from last saved run if available, otherwise fresh
    const h = orgAssessments[currentOrg.id] || {};
    const runs = h[`cis_${ig}`] || [];
    const last = runs.length ? runs[runs.length - 1] : null;
    cisState = { ig, answers: last ? Object.assign({}, last.answers || {}) : {}, openPanels: {} };
  }
  const igNums = { ig1: 1, ig2: 2, ig3: 3 };
  const igColors = { ig1: '#15803d', ig2: '#1d4ed8', ig3: '#6d28d9' };
  const igDescs = {
    ig1: 'Basic cyber hygiene — suitable for all organisations regardless of size or complexity.',
    ig2: 'Includes all IG1 safeguards plus additional controls for medium-complexity environments handling sensitive data.',
    ig3: 'Full control set — for mature security programs, critical infrastructure, or high-value targets.'
  };
  const sfs = cisGetSafeguards(ig);
  const { score, answered, total } = cisCalcScore(ig);
  const band = score >= 75 ? 'Strong Posture' : score >= 60 ? 'Moderate Risk' : score >= 40 ? 'Elevated Risk' : 'High Risk';
  const bandCls = score >= 75 ? 'band-high' : score >= 60 ? 'band-mid' : 'band-low';
  // Group by control number
  const controls = {};
  sfs.forEach(s => {
    if (!controls[s.ctrl]) controls[s.ctrl] = { name: s.ctrlName, safeguards: [] };
    controls[s.ctrl].safeguards.push(s);
  });
  const h = orgAssessments[currentOrg.id] || {};
  const runs = (h[`cis_${ig}`] || []);
  let html = `
  ${renderTierBanner()}
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.85rem;flex-wrap:wrap;gap:8px">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div style="font-size:17px;font-weight:700">✅ CIS Controls v8</div>
        <span class="ig-badge ig${igNums[ig]}-badge" style="font-size:11px;padding:3px 9px">Implementation Group ${igNums[ig]}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);max-width:560px">${igDescs[ig]}</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="setNav('assessments')">← All Assessments</button>
      ${['ig1','ig2','ig3'].map(l => l === ig ? '' : `<button class="btn btn-outline btn-sm" onclick="setNav('cis_${l}')">Switch to IG${igNums[l]}</button>`).join('')}
    </div>
  </div>
  <div class="score-hero-ins" style="margin-bottom:1rem">
    <div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:4px">CIS Controls v8 — IG${igNums[ig]}</div>
      <div class="score-big" style="color:#fff">${answered < total ? '—' : score}<span>${answered < total ? '' : '/100'}</span></div>
      ${answered >= total ? `<div class="score-band ${bandCls}" style="margin-top:6px">${band}</div>` : ''}
      <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px">${answered}/${total} safeguards answered</div>
    </div>
    <div style="text-align:right">
      ${runs.length >= 2 ? `<div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:4px">Trend</div><canvas id="trendChart" width="200" height="60"></canvas>` : (runs.length === 1 ? `<div style="font-size:11px;color:rgba(255,255,255,0.3)">1 run — trend<br>appears after 2nd save</div>` : `<div style="font-size:11px;color:rgba(255,255,255,0.3)">No history yet</div>`)}
      ${answered >= total ? `<div style="margin-top:10px"><button class="btn btn-cyan btn-sm" id="cisSaveBtn" onclick="cisSave('${ig}')">Save to Database</button></div>` : ''}
    </div>
  </div>`;

  // Render controls and safeguards
  Object.entries(controls).forEach(([ctrlNum, ctrl]) => {
    const ctrlAnswered = ctrl.safeguards.filter(s => cisState.answers[s.sf] !== undefined).length;
    const isOpen = cisState.openPanels[`ctrl_${ctrlNum}`];
    html += `
    <div class="survey-panel">
      <div class="sph" onclick="cisToggleCtrl(${ctrlNum})">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="cis-control-header" style="margin:0;padding:4px 8px">
            <div class="cis-ctrl-num">Control ${ctrlNum}</div>
          </div>
          <div>
            <div class="cis-ctrl-name" style="font-size:13px">${ctrl.name}</div>

          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${ctrlAnswered === ctrl.safeguards.length ? 'b-green' : ctrlAnswered > 0 ? 'b-amber' : 'b-gray'}">${ctrlAnswered === ctrl.safeguards.length ? 'Done' : ctrlAnswered > 0 ? 'In progress' : 'Not started'}</span>

        </div>
      </div>
      <div class="spb${isOpen ? ' open' : ''}">

    setTimeout(() => {
      const canvas = document.getElementById('trendChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.offsetWidth || 200; canvas.width = W; const H = 60;
      ctx.clearRect(0, 0, W, H);
      const scores = runs.map(r => r.score);
      const mn = Math.max(0, Math.min(...scores) - 10), mx = Math.min(100, Math.max(...scores) + 10);
      const px = i => Math.round(i * (W - 20) / (runs.length - 1) + 10);
      const py = v => Math.round(H - 6 - (v - mn) / (mx - mn) * (H - 16));
      ctx.beginPath(); ctx.strokeStyle = igColors[ig]; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      scores.forEach((s, i) => { i === 0 ? ctx.moveTo(px(i), py(s)) : ctx.lineTo(px(i), py(s)); }); ctx.stroke();
      scores.forEach((s, i) => {
        ctx.beginPath(); ctx.arc(px(i), py(s), 4, 0, Math.PI * 2);
        ctx.fillStyle = s >= 75 ? '#15803d' : s >= 50 ? '#b45309' : '#b91c1c'; ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Kanit,sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s, px(i), py(s) - 7);
      });
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '9px Kanit,sans-serif';
      runs.forEach((r, i) => { ctx.textAlign = 'center'; ctx.fillText(r.date.slice(5), px(i), H); });
    }, 80);
  }

  return html;
}

function cisToggleCtrl(ctrlNum) {
  cisState.openPanels[`ctrl_${ctrlNum}`] = !cisState.openPanels[`ctrl_${ctrlNum}`];
  renderMain();
}

function cisAnswer(sf, val, ig) {
  cisState.answers[sf] = val;
  const sf_obj = CIS_SAFEGUARDS.find(s => s.sf === sf);
  if (sf_obj && !cisState.openPanels[`ctrl_${sf_obj.ctrl}`]) {
    cisState.openPanels[`ctrl_${sf_obj.ctrl}`] = true;
  }
  renderMain();
}

function cisExpandAll(ig, open) {
  const sfs = cisGetSafeguards(ig);
  const ctrls = [...new Set(sfs.map(s => s.ctrl))];
  ctrls.forEach(c => { cisState.openPanels[`ctrl_${c}`] = open; });
  renderMain();
}

async function cisSave(ig) {
  const { score } = cisCalcScore(ig);
  const today = new Date().toISOString().split('T')[0];
  const moduleId = `cis_${ig}`;
  const btn = document.getElementById('cisSaveBtn') || document.getElementById('cisSaveBtn2');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…'; }
  try {
    await sb.saveAssessment({ org_id: currentOrg.id, module: moduleId, score, answers: cisState.answers, assessed_at: today });
    if (!orgAssessments[currentOrg.id]) orgAssessments[currentOrg.id] = {};
    if (!orgAssessments[currentOrg.id][moduleId]) orgAssessments[currentOrg.id][moduleId] = [];
    orgAssessments[currentOrg.id][moduleId].push({ date: today, score, answers: cisState.answers });
    cisState = { ig, answers: {}, openPanels: {} };
    toast(`✓ CIS IG${ig.replace('ig','')} score saved for ${currentOrg.name}`, '#15803d');
    buildNav(); renderMain();
  } catch (e) {
    toast('Save failed: ' + e.message, '#dc2626');
    if (btn) { btn.disabled = false; btn.textContent = 'Save to Database'; }
  }
}

// In-memory state mirror — Supabase rows are the source of truth on reload.
let ttState = null;
function ttInit() {
  ttState = {
    view: 'setup',                     // setup | commentary | declaration | inject | breach | notif | aar
    scenarioId: null,
    facilitatorName: '',
    sessionId: null,
    sessionCode: null,
    currentInject: 0,
    declaration: { signal: '', severity: '', declare: null, assessment: '' },
    responses: {},                     // { [injectIdx]: { [roleId]: { text, criticality } } }
    breach: { declared: false, ic_sign_time: null, es_sign_time: null, rationale: '' },
    notifChecks: {},                   // { [itemId]: { checked, checkedAt } }
    notifStartTime: null,
    exerciseLog: [],
  };
}

// Capture any in-DOM textarea/input values into ttState before re-rendering destroys them.
function ttSnapshot() {
  if (!ttState) return;
  const fac = document.getElementById('ttFacName');     if (fac) ttState.facilitatorName        = fac.value;
  const da  = document.getElementById('ttDeclAss');     if (da)  ttState.declaration.assessment = da.value;
  const br  = document.getElementById('ttBreachRat');   if (br)  ttState.breach.rationale       = br.value;
  if (ttState.currentInject != null) {
    const idx = ttState.currentInject;
    TT_ROLES.forEach(r => {
      const ta = document.getElementById(`ttResp_${idx}_${r.id}`);
      if (!ta) return;
      ttState.responses[idx] = ttState.responses[idx] || {};
      ttState.responses[idx][r.id] = ttState.responses[idx][r.id] || {};
      ttState.responses[idx][r.id].text = ta.value;
    });
  }
}

function ttRender() {
  document.getElementById('mainContent').innerHTML = renderTabletop();
  // After render, refresh dynamic multiplayer panels without full re-render
  setTimeout(() => {
    if (!ttState) return;
    if (ttState.view === 'commentary' || ttState.view === 'inject') ttFacRefreshLobby();
    if (ttState.view === 'inject') ttFacRefreshResponses(ttState.currentInject);
  }, 80);
}

async function ttLog(type, detail) {
  if (!ttState || !ttState.sessionId) return;
  const entry = { ts: new Date().toISOString(), type, detail };
  ttState.exerciseLog.push(entry);
  try { await sb.tt.appendLog(ttState.sessionId, ttState.exerciseLog); }
  catch (e) { console.warn('TT log save failed', e); }
}

function renderTabletop() {
  if (!ttState) ttInit();
  switch (ttState.view) {
    case 'setup':       return ttRenderSetup();
    case 'commentary':  return ttRenderCommentary();
    case 'declaration': return ttRenderDeclaration();
    case 'inject':      return ttRenderInject();
    case 'breach':      return ttRenderBreachGate();
    case 'notif':       return ttRenderNotif();
    case 'aar':         return ttRenderAAR();
    default:            return '<div class="card">Unknown tabletop view.</div>';
  }
}

// ---- Shared header (shown on every view after setup) ----
function ttHeaderBar() {
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  return `<div class="card" style="padding:0.7rem 1rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:10px">
    <span style="font-size:14px">🎯</span>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700">${scenario ? scenario.title : 'Tabletop'}</div>
      <div style="font-size:10px;color:var(--muted)">Facilitator: ${ttState.facilitatorName || '—'}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:9px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase">Session code</div>
      <div style="font-size:14px;font-weight:700;color:var(--cyan);letter-spacing:0.1em">${ttState.sessionCode || '—'}</div>
    </div>
  </div>`;
}

function ttNistTrack(activeIdx, declStep) {
  return `<div class="nist-track">
    ${declStep ? `<div class="nist-step decl-step">Step 0 · TL Declare</div>` : ''}

}

function ttGoto(view) { ttSnapshot(); ttState.view = view; ttRender(); }
function ttBack(view) { ttSnapshot(); ttState.view = view; ttRender(); }

async function ttLaunchSession() {
  ttSnapshot();
  if (!currentOrg) { toast('Select an organisation first', '#dc2626'); return; }
  if (!ttState.scenarioId) { toast('Pick a scenario', '#dc2626'); return; }
  if (!ttState.facilitatorName.trim()) { toast('Enter facilitator name', '#dc2626'); return; }
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  try {
    const code = await sb.tt.newCode();
    if (!code) throw new Error('Session code RPC returned empty');
    const created = await sb.tt.createSession({
      org_id: currentOrg.id,
      scenario_id: scenario.id,
      scenario_title: scenario.title,
      session_code: code,
      status: 'active',
      facilitator_name: ttState.facilitatorName.trim(),
      current_inject: 0,
      exercise_log: [],
    });
    ttState.sessionId = created.id;
    ttState.sessionCode = created.session_code;
    ttState.view = 'commentary';
    await ttLog('session_created', { code: created.session_code, scenario: scenario.title, facilitator: ttState.facilitatorName });
    toast('Session ' + created.session_code + ' created', '#15803d');
    ttStartFacPoll();
    ttRender();
  } catch (e) {
    toast('Could not create session — ' + e.message, '#dc2626');
    console.error(e);
  }
}

function ttRenderDeclaration() {
  const scenario = TT_SCENARIOS[ttState.scenarioId];

function ttSetSev(s) { ttSnapshot(); ttState.declaration.severity = s; ttRender(); }
function ttSetDec(b) { ttSnapshot(); ttState.declaration.declare  = b; ttRender(); }

async function ttSubmitDeclaration() {
  ttSnapshot();
  if (!ttState.declaration.severity) { toast('Pick a severity', '#dc2626'); return; }
  if (ttState.declaration.declare === null) { toast('Declare or monitor?', '#dc2626'); return; }
  if (!ttState.declaration.assessment.trim()) { toast('Add a brief technical assessment', '#dc2626'); return; }
  try {
    await sb.tt.updateSession(ttState.sessionId, {
      declaration_logged: true,
      tl_assessment: ttState.declaration.assessment,
      tl_severity: ttState.declaration.severity,
      tl_declare: ttState.declaration.declare,
      updated_at: new Date().toISOString(),
    });
    await ttLog('declaration', { severity: ttState.declaration.severity, declare: ttState.declaration.declare });
    if (ttState.declaration.declare === false) {
      toast('TL chose to monitor — exercise ending', '#b45309');
      ttState.view = 'aar';
    } else {
      ttState.view = 'inject';
      ttState.currentInject = 0;
    }
    ttRender();
  } catch (e) { toast('Could not save declaration — ' + e.message, '#dc2626'); }
}

// ---- INJECT ----
function ttRenderInject() {
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  const idx = ttState.currentInject;
  const inj = scenario.injects[idx];
  if (!inj) {
    // Past the last inject — pick next gate
    ttState.view = ttState.breach.declared ? 'notif' : 'aar';
    return renderTabletop();
  }
  const responses = ttState.responses[idx] || {};
  return `${renderTierBanner()}
  ${ttHeaderBar()}
  ${ttNistTrack(inj.phaseIdx)}
  <div class="inject-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
      <span class="badge b-cyan">Inject ${idx + 1} of ${scenario.injects.length}</span>
      <span class="badge b-gray">${inj.ingest}</span>
      <span class="badge b-navy">${TT_NIST_PHASES[inj.phaseIdx]}</span>
    </div>
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">${inj.title}</div>
    <div class="inject-body-box">${inj.body}</div>
    <div class="role-grid">
      ${TT_ROLES.map(r => {
        const rr = responses[r.id] || {};
        const crit = rr.criticality || '';
        return `<div class="role-resp">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <span style="font-size:14px">${r.icon}</span>
            <div style="font-size:11px;font-weight:700;color:var(--navy)">${r.name}</div>
          </div>
          <div style="font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px"><b>Prompt:</b> ${inj.rolePrompts[r.id]}</div>
          <textarea id="ttResp_${idx}_${r.id}" placeholder="Action / decision taken" style="min-height:48px;font-size:11px">${(rr.text || '').replace(/</g,'&lt;')}</textarea>
          <div style="margin-top:5px">
            ${['Critical','High','Medium','Low'].map(c => `<button class="crit-btn ${crit === c ? 'sel-' + c : ''}" onclick="ttSetCrit(${idx},'${r.id}','${c}')">${c}</button>`).join(' ')}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${inj.triggersBreach && !ttState.breach.declared ? `<div class="fn-box" style="font-size:12px"><b>⚠️ Breach trigger.</b> This inject contains a breach indicator. After responses are saved, the breach declaration gate opens.</div>` : ''}
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:center">
      <button class="btn btn-outline btn-sm" onclick="ttPrevInject()" ${idx === 0 ? 'disabled' : ''}>← Previous inject</button>
      <div style="display:flex;gap:6px">
        <button class="btn btn-cyan btn-sm" onclick="ttSaveResponses(${idx}, false)">Save responses</button>
        <button class="btn btn-primary" onclick="ttSaveResponses(${idx}, true)">Save & continue →</button>
      </div>
    </div>
  </div>
  ${ttRenderLobbyPanel()}
  ${ttRenderResponseFeedPanel(idx)}`;
}

function ttSetCrit(idx, roleId, c) {
  ttSnapshot();
  ttState.responses[idx] = ttState.responses[idx] || {};
  ttState.responses[idx][roleId] = ttState.responses[idx][roleId] || {};
  ttState.responses[idx][roleId].criticality = c;
  ttRender();
}

function ttPrevInject() {
  ttSnapshot();
  if (ttState.currentInject > 0) { ttState.currentInject -= 1; ttRender(); }
}

async function ttSaveResponses(idx, advance) {
  ttSnapshot();
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  const inj = scenario.injects[idx];
  for (const r of TT_ROLES) {
    const rr = (ttState.responses[idx] && ttState.responses[idx][r.id]) || {};
    const text = (rr.text || '').trim();
    if (!text && !rr.criticality) continue;
    try {
      await sb.tt.upsertResponse({
        session_id: ttState.sessionId,
        inject_index: idx,
        role_id: r.id,
        response_text: text || null,
        criticality: rr.criticality || null,
      });
    } catch (e) { console.warn('response save failed for', r.id, e); }
  }
  await ttLog('inject_responses_saved', { inject: idx });
  toast('Responses saved', '#15803d');
  if (!advance) { ttRender(); return; }
  // Advance
  if (inj.triggersBreach && !ttState.breach.declared) {
    ttState.view = 'breach';
  } else if (idx + 1 < scenario.injects.length) {
    ttState.currentInject = idx + 1;
  } else if (ttState.breach.declared) {
    ttState.view = 'notif';
  } else {
    ttState.view = 'aar';
  }
  try {
    await sb.tt.updateSession(ttState.sessionId, { current_inject: ttState.currentInject, updated_at: new Date().toISOString() });
  } catch (e) { console.warn('session pointer save failed', e); }
  ttRender();
}

        <button class="btn ${b.es_sign_time ? 'btn-green' : 'btn-cyan'} btn-sm" onclick="ttSignBreach('es')" ${b.es_sign_time ? 'disabled' : ''}>${b.es_sign_time ? '✓ Signed' : 'Sign as ES'}</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">

}

function ttSignBreach(role) {
  ttSnapshot();
  const ts = new Date().toISOString();
  if (role === 'ic') ttState.breach.ic_sign_time = ts;
  if (role === 'es') ttState.breach.es_sign_time = ts;
  ttRender();
}

function ttCancelBreach() {
  ttSnapshot();
  ttState.breach.ic_sign_time = null;
  ttState.breach.es_sign_time = null;
  ttState.view = 'inject';
  ttRender();
}

async function ttDeclareBreach() {
  ttSnapshot();
  if (!ttState.breach.rationale.trim()) { toast('Add a rationale', '#dc2626'); return; }
  const ts = new Date().toISOString();
  ttState.breach.declared = true;
  ttState.notifStartTime = ts;
  try {
    await sb.tt.updateSession(ttState.sessionId, {
      breach_declared: true,
      breach_timestamp: ts,
      breach_rationale: ttState.breach.rationale,
      ic_sign_time: ttState.breach.ic_sign_time,
      es_sign_time: ttState.breach.es_sign_time,
      updated_at: ts,
    });
    await ttLog('breach_declared', { ts, rationale: ttState.breach.rationale });
    toast('Breach declared — notification clock started', '#b91c1c');
    const scenario = TT_SCENARIOS[ttState.scenarioId];
    if (ttState.currentInject + 1 < scenario.injects.length) {
      ttState.currentInject += 1;
      ttState.view = 'inject';
    } else {
      ttState.view = 'notif';
    }
    ttRender();
  } catch (e) { toast('Could not save breach — ' + e.message, '#dc2626'); }
}

// ---- NOTIF CHECKLIST ----
function ttRenderNotif() {
  const elapsedHr = ttState.notifStartTime ? Math.floor((Date.now() - new Date(ttState.notifStartTime).getTime()) / 36e5) : 0;
  const remaining = Math.max(0, 72 - elapsedHr);
  return `${renderTierBanner()}
  ${ttHeaderBar()}
  <div class="notif-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);margin-bottom:3px">Insurer + regulatory notification</div>
        <div style="font-size:14px;font-weight:700">8-item checklist · 72-hour clock</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:9px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase">Time remaining</div>
        <div style="font-size:18px;font-weight:700;color:${remaining < 24 ? 'var(--red)' : 'var(--amber)'}">${remaining}h</div>
      </div>
    </div>
    ${TT_NOTIF_ITEMS.map(it => {
      const c = ttState.notifChecks[it.id];
      const checked = c && c.checked;
      return `<div class="notif-item">
        <div class="notif-check ${checked ? 'checked' : ''}" onclick="ttToggleNotif('${it.id}')">${checked ? '✓' : ''}</div>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:700">${it.label}</div>
          <div style="font-size:10px;color:var(--muted)">${it.detail}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">Target window: ${it.clockHr}h</div>
        </div>
        ${checked && c.checkedAt ? `<span class="badge b-green">✓ ${new Date(c.checkedAt).toLocaleTimeString()}</span>` : ''}
      </div>`;
    }).join('')}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-outline btn-sm" onclick="ttBackToLastInject()">← Back to injects</button>
      <button class="btn btn-primary" onclick="ttGoto('aar')">Generate AAR →</button>
    </div>
  </div>`;
}

function ttBackToLastInject() {
  ttSnapshot();
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  ttState.currentInject = Math.min(ttState.currentInject, scenario.injects.length - 1);
  ttState.view = 'inject';
  ttRender();
}

async function ttToggleNotif(itemId) {
  ttSnapshot();
  const cur = ttState.notifChecks[itemId] && ttState.notifChecks[itemId].checked;
  const checked = !cur;
  const ts = new Date().toISOString();
  ttState.notifChecks[itemId] = { checked, checkedAt: checked ? ts : null };
  try {
    await sb.tt.upsertNotif({
      session_id: ttState.sessionId,
      item_id: itemId,
      checked,
      checked_at: checked ? ts : null,
    });
    await ttLog('notif_toggle', { item: itemId, checked });
  } catch (e) { console.warn('notif save failed', e); }
  ttRender();
}

// ---- AAR ----
function ttRenderAAR() {
  const scenario = TT_SCENARIOS[ttState.scenarioId];
  const totalInjects = scenario.injects.length;
  const injectsAnswered = Object.keys(ttState.responses).length;
  let critTotal = 0, critCorrect = 0;
  scenario.injects.forEach((inj, idx) => {
    const r = ttState.responses[idx] || {};
    TT_ROLES.forEach(role => {
      const cr = r[role.id] && r[role.id].criticality;
      if (cr) { critTotal++; if (cr === inj.correctCriticality) critCorrect++; }
    });
  });
  const critAccPct = critTotal ? Math.round(critCorrect / critTotal * 100) : 0;
  const sevMatch = ttState.declaration.severity === scenario.declaration.correctSeverity;
  const declMatch = ttState.declaration.declare === scenario.declaration.correctDeclare;
  const notifChecked = Object.values(ttState.notifChecks).filter(n => n.checked).length;
  // Composite score: severity match (25) + declare match (25) + criticality accuracy (50)
  const score = Math.round((sevMatch ? 25 : 0) + (declMatch ? 25 : 0) + (critAccPct * 0.5));
  return `${renderTierBanner()}
  ${ttHeaderBar()}
  <div style="font-size:17px;font-weight:700;margin-bottom:0.85rem">📄 After Action Report — ${scenario.title}</div>
  <div class="summary-metrics">
    <div class="sm-card"><div class="sm-val">${score}</div><div class="sm-lbl">Exercise score</div></div>
    <div class="sm-card"><div class="sm-val">${critAccPct}%</div><div class="sm-lbl">Criticality acc.</div></div>
    <div class="sm-card"><div class="sm-val">${injectsAnswered}/${totalInjects}</div><div class="sm-lbl">Injects answered</div></div>
    <div class="sm-card"><div class="sm-val">${notifChecked}/${TT_NOTIF_ITEMS.length}</div><div class="sm-lbl">Notifs filed</div></div>
  </div>

  <div class="card">
    <div class="card-title">Step 0 — Declaration accuracy</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <div style="font-size:11px;color:var(--muted)">TL severity called</div>
        <div style="font-size:14px;font-weight:700">${ttState.declaration.severity || '—'}
          <span style="font-size:11px;color:${sevMatch ? 'var(--green)' : 'var(--red)'};font-weight:700">${sevMatch ? '✓ matches' : '✗ correct was ' + scenario.declaration.correctSeverity}</span>
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted)">TL recommendation</div>
        <div style="font-size:14px;font-weight:700">${ttState.declaration.declare === null ? '—' : (ttState.declaration.declare ? 'Declare' : 'Monitor')}
          <span style="font-size:11px;color:${declMatch ? 'var(--green)' : 'var(--red)'};font-weight:700">${declMatch ? '✓ matches' : '✗ correct was ' + (scenario.declaration.correctDeclare ? 'Declare' : 'Monitor')}</span>
        </div>
      </div>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--muted)"><b>TL written assessment:</b><br/>${ttState.declaration.assessment || '<i>not provided</i>'}</div>
  </div>

  <div class="card">
    <div class="card-title">MITRE ATT&CK mapping (revealed)</div>
    ${scenario.injects.map((inj, i) => `
      <div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
        <div><b>Inject ${i+1}</b> — ${inj.title}</div>
        <div style="color:var(--muted);font-size:11px;margin-top:2px">${inj.mitre.tactic} · ${inj.mitre.technique}</div>
      </div>`).join('')}
  </div>

  <div class="card">
    <div class="card-title">Criticality accuracy by inject</div>
    ${scenario.injects.map((inj, i) => {
      const r = ttState.responses[i] || {};
      return `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
          <span><b>Inject ${i+1}</b> — ${inj.title}</span>
          <span class="badge b-navy">Correct: ${inj.correctCriticality}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px">
          ${TT_ROLES.map(role => {
            const cr = r[role.id] && r[role.id].criticality;
            if (!cr) return `<span style="font-size:10px;color:var(--muted)">${role.icon} ${role.id.toUpperCase()}: —</span>`;
            const ok = cr === inj.correctCriticality;
            return `<span class="badge ${ok ? 'b-green' : 'b-red'}">${role.icon} ${role.id.toUpperCase()}: ${cr}${ok ? ' ✓' : ' ✗'}</span>`;
          }).join(' ')}
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <div class="card-title">Breach declaration record</div>
    ${ttState.breach.declared ? `
      <div style="font-size:12px;line-height:1.6">
        <div><b>Declared:</b> ${new Date(ttState.notifStartTime).toLocaleString()}</div>
        <div><b>IC signed:</b> ${new Date(ttState.breach.ic_sign_time).toLocaleString()}</div>
        <div><b>ES signed:</b> ${new Date(ttState.breach.es_sign_time).toLocaleString()}</div>
        <div style="margin-top:6px"><b>Rationale:</b> ${ttState.breach.rationale}</div>
      </div>` : `<div style="font-size:12px;color:var(--muted)">No formal breach was declared during this exercise.</div>`}
  </div>

  <div class="card">
    <div class="card-title">Insurer / regulatory notifications</div>
    ${TT_NOTIF_ITEMS.map(it => {
      const c = ttState.notifChecks[it.id];
      return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
        <span style="font-size:14px">${c && c.checked ? '✅' : '⬜'}</span>
        <span style="flex:1">${it.label}</span>
        <span style="font-size:11px;color:var(--muted)">${c && c.checked && c.checkedAt ? new Date(c.checkedAt).toLocaleTimeString() : 'Not filed'}</span>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <div class="card-title">Full event timeline</div>
    ${ttState.exerciseLog.length ? ttState.exerciseLog.map(e => `
      <div class="aar-log-item">
        <div>${new Date(e.ts).toLocaleTimeString()}</div>
        <div style="color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:0.06em">${e.type}</div>
        <div>${typeof e.detail === 'object' ? JSON.stringify(e.detail) : (e.detail || '')}</div>
      </div>`).join('') : '<div style="font-size:12px;color:var(--muted)">No log entries.</div>'}
  </div>

  <div class="card">
    <div class="card-title">IR plan comparison</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6">
      Upload your ratified IR plan to auto-compare against this exercise's event log. The automated comparison is on the backlog (item t34a). For now, the facilitator reviews the timeline above against the plan manually and notes where decisions diverged from documented procedure or where the plan was silent.
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="btn btn-outline" onclick="ttFinalise()">Mark exercise complete</button>
    <button class="btn btn-primary" onclick="ttRestart()">Start new exercise</button>
  </div>`;
}

async function ttFinalise() {
  if (!ttState || !ttState.sessionId) { toast('No active session', '#dc2626'); return; }
  try {
    await sb.tt.updateSession(ttState.sessionId, {
      status: 'complete',
      notif_filed: Object.values(ttState.notifChecks).some(n => n.checked),
      updated_at: new Date().toISOString(),
    });
    await ttLog('exercise_complete', { totalInjects: TT_SCENARIOS[ttState.scenarioId].injects.length });
    toast('Exercise marked complete', '#15803d');
  } catch (e) { toast('Save failed — ' + e.message, '#dc2626'); }
}

function ttRestart() { ttInit(); ttRender(); }
